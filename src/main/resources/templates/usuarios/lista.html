<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" id="pagina">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="cabecalho">
        <h1>Usuários</h1>
        <a class="btn" th:href="@{/app/usuarios/novo}" data-perfil="ADMIN">Novo usuário</a>
    </div>

    <form class="cartao filtros" id="form-filtros" style="margin-top: 16px">
        <div class="campo">
            <label for="perfil">Perfil</label>
            <select id="perfil" name="perfil"></select>
        </div>
        <div class="acoes">
            <button type="submit" class="btn">Filtrar</button>
            <button type="button" class="btn btn-secundario" id="btn-limpar">Limpar</button>
        </div>
    </form>

    <section class="cartao">
        <p class="suave" id="vazio" hidden>Nenhum usuário encontrado.</p>
        <div class="tabela-rolagem" id="tabela">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Perfil</th>
                    <th>Ativo</th>
                </tr>
                </thead>
                <tbody id="lista-usuarios"></tbody>
            </table>
        </div>
    </section>
</main>
<script th:src="@{/js/paginas/usuarios-lista.js}"></script>
</body>
</html>
