spring.application.name=chamados

spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.serialization-mode=via-dto

# Autenticação JWT (em produção, defina JWT_SEGREDO e ADMIN_SENHA via variável de ambiente)
seguranca.jwt.segredo=${JWT_SEGREDO:dev-segredo-chamados-trocar-em-producao-0123456789}
seguranca.jwt.expiracao-minutos=60

seguranca.admin.nome=Administrador
seguranca.admin.email=${ADMIN_EMAIL:admin@chamados.com}
seguranca.admin.senha=${ADMIN_SENHA:admin123}
